<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="vendor/quill/quill.snow.css">
  <link rel="stylesheet" href="vendor/quill/quill.core.css">
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #0b0d12;
      color: #e8ecf4;
    }
    #error-banner {
      display: none;
      padding: 16px 20px;
      background: #3b0a0a;
      color: #ffbcbc;
      font-weight: 600;
      font-size: 16px;
      border-bottom: 2px solid #d94f4f;
    }
    .toolbar-wrapper {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      background: #111522;
      border-bottom: 1px solid #1f2638;
    }
    #toolbar {
      border: none;
      background: transparent;
    }
    #toolbar .ql-formats {
      margin-right: 10px;
    }
    .toolbar-actions {
      display: flex;
      gap: 8px;
    }
    .toolbar-actions button {
      background: #1f2937;
      color: #e8ecf4;
      border: 1px solid #2b3348;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 6px;
      font-size: 13px;
    }
    .toolbar-actions button:hover {
      background: #2a3546;
    }
    #editor {
      height: calc(100vh - 74px);
    }
    .ql-container.ql-snow {
      border: none;
      background: #ffffff;
      color: #111827;
    }
    .ql-editor {
      min-height: 100%;
      color: #111827;
    }
    .ql-toolbar.ql-snow {
      border: none;
      background: transparent;
    }
    .ql-toolbar.ql-snow .ql-picker-label,
    .ql-toolbar.ql-snow .ql-picker-item,
    .ql-toolbar.ql-snow button {
      color: #e8ecf4;
      fill: #e8ecf4;
      stroke: #e8ecf4;
    }
    .ql-toolbar.ql-snow .ql-picker-options {
      background: #1a1f2f;
      border: 1px solid #2a3248;
    }
    .ql-toolbar.ql-snow .ql-picker-item:hover,
    .ql-toolbar.ql-snow .ql-picker-label:hover,
    .ql-toolbar.ql-snow button:hover {
      color: #ffffff;
    }
    .ql-snow .ql-stroke {
      stroke: #e8ecf4;
    }
    .ql-snow .ql-fill {
      fill: #e8ecf4;
    }
    .ql-snow .ql-picker-options .ql-picker-item {
      color: #e8ecf4;
    }
  </style>
</head>
<body>
  <div id="error-banner"></div>
  <div class="toolbar-wrapper">
    <div id="toolbar">
      <span class="ql-formats">
        <button class="ql-bold"></button>
        <button class="ql-underline"></button>
      </span>
      <span class="ql-formats">
        <select class="ql-color"></select>
        <select class="ql-background"></select>
      </span>
      <span class="ql-formats">
        <button class="ql-list" value="ordered"></button>
        <button class="ql-list" value="bullet"></button>
      </span>
      <span class="ql-formats">
        <button class="ql-link"></button>
        <button class="ql-clean"></button>
      </span>
    </div>
    <div class="toolbar-actions">
      <button id="make-cards" type="button">Выделение → карточки</button>
    </div>
  </div>
  <div id="editor"></div>

  <script src="vendor/quill/quill.min.js"></script>
  <script>
    const errorBanner = document.getElementById('error-banner');

    function showError(message) {
      errorBanner.textContent = message;
      errorBanner.style.display = 'block';
    }

    window.onerror = function(msg, src, line, col, err) {
      try {
        if (window.pywebview && window.pywebview.api && window.pywebview.api.log_js_error) {
          window.pywebview.api.log_js_error(`JS error: ${msg} @ ${line}:${col}`);
        }
      } catch (_) {
        return false;
      }
      return false;
    };

    function stylesheetLooksEmpty(fragment) {
      const sheet = Array.from(document.styleSheets).find(
        (item) => item.href && item.href.includes(fragment)
      );
      if (!sheet) {
        return true;
      }
      try {
        return sheet.cssRules.length === 0;
      } catch (err) {
        return false;
      }
    }

    let errorMessage = '';
    if (typeof Quill === 'undefined') {
      errorMessage = 'Quill не загружен. Проверьте vendor/quill/quill.min.js и пути.';
    }
    if (stylesheetLooksEmpty('quill.snow.css')) {
      errorMessage = errorMessage
        ? `${errorMessage}\nQuill не найден / пустые файлы`
        : 'Quill не найден / пустые файлы';
    }
    if (errorMessage) {
      showError(errorMessage);
    }

    function onPywebviewReady() {
      try {
        if (!window.pywebview || !window.pywebview.api) return;
        if (window.pywebview.api.notify_editor_ready) {
          window.pywebview.api.notify_editor_ready();
        }
        if (window.pywebview.api.pull_initial_html) {
          window.pywebview.api.pull_initial_html()
            .then((html) => {
              if (html) {
                window.setHtml(html);
              }
            })
            .catch((e) => {
              if (window.pywebview.api.log_js_error) {
                window.pywebview.api.log_js_error(`pull_initial_html error: ${e}`);
              }
            });
        }
      } catch (_) {
        return;
      }
    }

    document.addEventListener('pywebviewready', onPywebviewReady);
    if (window.pywebview && window.pywebview.api) {
      onPywebviewReady();
    }

    window.setHtml = function(html) {
      if (!window.quill) return;
      if (typeof html !== "string") html = String(html || "");
      const m = html.match(/^<pre[^>]*>([\s\S]*)<\/pre>$/i);
      if (m) {
        const text = m[1]
          .replace(/<\/?[^>]+>/g, "")
          .replace(/\n/g, "<br>");
        html = "<p>" + text + "</p>";
      }
      window.quill.setText("");
      window.quill.clipboard.dangerouslyPasteHTML(html);
    };

    window.quill = null;
    if (typeof Quill !== 'undefined') {
      window.quill = new Quill('#editor', {
        theme: 'snow',
        modules: {
          toolbar: '#toolbar'
        }
      });
    }

    window.getHtml = function() {
      return window.quill ? window.quill.root.innerHTML : '';
    };

    window.getSelectionHtml = function() {
      const selection = window.getSelection();
      if (!selection || selection.isCollapsed) {
        return '';
      }
      const range = selection.getRangeAt(0);
      const container = document.createElement('div');
      container.appendChild(range.cloneContents());
      return container.innerHTML;
    };

    document.getElementById('make-cards').addEventListener('click', () => {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.make_cards_from_selection) {
        window.pywebview.api.make_cards_from_selection();
      } else {
        showError("pywebview API ещё не готов.");
        if (window.pywebview && window.pywebview.api && window.pywebview.api.log_js_error) {
          window.pywebview.api.log_js_error("make_cards_from_selection: pywebview API not ready");
        }
      }
    });
  </script>
</body>
</html>
